name: Build Self Release (Android arm64)

on:
  push:
    tags:
      - 'v*-self'

permissions:
  contents: write

jobs:
  android-arm64:
    name: Build Android arm64 release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag and app version
        shell: bash
        run: |
          app_version=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          expected_tag="v${app_version}-self"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version ${app_version}. Expected ${expected_tag}."
            exit 1
          fi
          echo "APP_VERSION=${app_version}" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Prepare self-build configuration
        shell: bash
        run: |
          # The upstream repository keeps these files encrypted with git-crypt.
          # A personal build does not need the upstream Sentry/Firebase credentials.
          cp lib/config/config.dart.sample lib/config/config.dart
          printf '%s\n' '// Firebase configuration is intentionally disabled for this self-build.' > lib/firebase_options.dart

          # Do not process the encrypted google-services.json.
          sed -i "/id 'com.google.gms.google-services'/d" android/app/build.gradle

          # Build only arm64-v8a and do not emit a universal APK.
          sed -i 's/universalApk true/universalApk false/' android/app/build.gradle
          sed -i 's/include "armeabi-v7a", "arm64-v8a", "x86_64"/include "arm64-v8a"/' android/app/build.gradle

      - name: Decode signing keystore
        shell: bash
        env:
          ENCODED_KEYSTORE: ${{ secrets.ENCODED_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$ENCODED_KEYSTORE"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$ENCODED_KEYSTORE" | base64 -d > android/app/keystore.jks
          test -s android/app/keystore.jks

      - name: Resolve Flutter dependencies
        run: |
          git config --global core.longpaths true
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter pub run intl_utils:generate

      - name: Build signed arm64 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --no-pub --target-platform android-arm64

      - name: Verify signed APK
        shell: bash
        run: |
          apk=$(find build/app/outputs/apk/release -type f -name '*arm64-v8a-release.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo 'arm64-v8a release APK not found.'
            find build/app/outputs/apk/release -maxdepth 1 -type f -print || true
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose "$apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eros-FE-${{ env.APP_VERSION }}-arm64-v8a
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Self-build from wcjjzz/eros_fe.

          - Version: ${APP_VERSION}
          - ABI: arm64-v8a only
          - Package name: com.honjow.fehviewer
          - Signed with the repository owner's self-build key
          - Upstream private Sentry/Firebase configuration is not included"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
              --title "$GITHUB_REF_NAME" \
              --notes "$notes"
          fi
